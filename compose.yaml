name: solo85-cellscope
services:
  desk:
    build:
      context: .
      args:
        CELLSCOPE_RUNTIME_IMAGE: ${CELLSCOPE_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${CELLSCOPE_IMAGE:-solo85-cellscope:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${CELLSCOPE_PORT:-19885}:8000"
    volumes:
      - el-library:/var/lib/cellscope
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/el/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  el-library:
